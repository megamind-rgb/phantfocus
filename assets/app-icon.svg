<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- PHANTFOCUS's icon: a lock in the ring of your locked-in time, in
     the Winter Arc design (near black lit by ice, red for a distraction).
     scripts/make_icon.sh turns it into AppIcon.icns. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a2e"/><stop offset=".55" stop-color="#050911"/><stop offset="1" stop-color="#030409"/></linearGradient>
  <radialGradient id="ice" cx=".5" cy="-.05" r=".85"><stop offset="0" stop-color="#7cc8ff" stop-opacity=".3"/><stop offset="1" stop-color="#7cc8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="ember" cx=".5" cy="1.12" r=".7"><stop offset="0" stop-color="#ff3b4a" stop-opacity=".3"/><stop offset="1" stop-color="#ff3b4a" stop-opacity="0"/></radialGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2faff"/><stop offset="1" stop-color="#5fb6ff"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#a9d6ff"/></linearGradient>
  <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf6ff"/><stop offset="1" stop-color="#8ccdff"/></linearGradient>
  <filter id="iceGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="redGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="bodyShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="lockShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
</defs>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tileShadow)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ice)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ember)"/>
<circle cx="214" cy="230" r="3" fill="#e6f4ff" opacity="0.5"/><circle cx="300" cy="180" r="2" fill="#e6f4ff" opacity="0.35"/><circle cx="760" cy="210" r="3" fill="#e6f4ff" opacity="0.45"/><circle cx="840" cy="330" r="2" fill="#e6f4ff" opacity="0.3"/><circle cx="180" cy="420" r="2" fill="#e6f4ff" opacity="0.25"/><circle cx="232" cy="640" r="3" fill="#e6f4ff" opacity="0.3"/><circle cx="300" cy="820" r="2" fill="#e6f4ff" opacity="0.25"/><circle cx="812" cy="610" r="2" fill="#e6f4ff" opacity="0.3"/><circle cx="760" cy="812" r="3" fill="#e6f4ff" opacity="0.35"/><circle cx="660" cy="170" r="2" fill="#e6f4ff" opacity="0.3"/><circle cx="420" cy="860" r="2" fill="#e6f4ff" opacity="0.2"/><circle cx="880" cy="500" r="2" fill="#e6f4ff" opacity="0.25"/><circle cx="150" cy="560" r="2" fill="#e6f4ff" opacity="0.2"/><circle cx="560" cy="880" r="3" fill="#e6f4ff" opacity="0.25"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
<rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#9fd4ff" stroke-opacity=".26" stroke-width="3"/>
<circle cx="512" cy="512" r="262" fill="none" stroke="rgba(124,200,255,.13)" stroke-width="50"/>
<path d="M512 250 A262 262 0 1 1 254.6 462.9" fill="none" stroke="url(#ring)" stroke-width="50" stroke-linecap="round" filter="url(#iceGlow)"/>
<g filter="url(#lockShadow)"><path d="M432 500.2 V439 A80 80 0 0 1 592 439 V500.2" fill="none" stroke="url(#shackle)" stroke-width="46" stroke-linecap="round"/><rect x="378" y="472.6" width="268" height="210" rx="50.4" fill="url(#metal)"/><rect x="378" y="472.6" width="268" height="210" rx="50.4" fill="url(#bodyShine)"/></g>
<g fill="#ff3b4a" filter="url(#redGlow)"><circle cx="512" cy="565" r="27.3"/><rect x="499.7" y="565" width="24.6" height="56.7" rx="12.3"/></g>
</svg>
