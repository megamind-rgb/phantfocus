  </defs>
  <rect width="2560" height="1600" fill="url(#base)"/>
  <ellipse cx="960" cy="136" rx="2368" ry="1160" fill="url(#upper)" filter="url(#silk-softness)" transform="rotate(17 960 136)"/>
  <ellipse cx="1152" cy="1664" rx="2304" ry="880" fill="url(#lower)" filter="url(#silk-softness)" transform="rotate(17 1152 1664)"/>
  <ellipse cx="1120" cy="660" rx="1680" ry="1050" fill="url(#pearl)"/>
